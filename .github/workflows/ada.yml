name: Ada (GNAT)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up GNAT toolchain
        run: >
          sudo apt-get update && sudo apt-get install gnat gprbuild

      - name: Build
        run: gprbuild -j0 -p
